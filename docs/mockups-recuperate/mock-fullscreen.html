<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RapScript RO — mock Nocturn (fullscreen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C0D10; --ink-line:#23252D;
    --text:#F4F5F7; --text-muted:#6B7180;
    --accent:#7C5CFF; --accent-strong:#9479FF; --accent-wash:rgba(124,92,255,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink); color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  /* halo discret */
  body::before{
    content:""; position:absolute; width:70vw; height:70vw; max-width:820px; max-height:820px;
    background:radial-gradient(circle, var(--accent-wash) 0%, transparent 62%);
    filter:blur(48px); pointer-events:none;
  }
  .word{
    position:relative; z-index:1;
    font-weight:700; font-size:clamp(4rem,21vw,17rem); line-height:.92;
    letter-spacing:-.025em; text-align:center;
  }
  .timer{
    position:relative; z-index:1; margin-top:48px;
    width:min(520px,60vw); height:4px; border-radius:9999px; background:var(--ink-line); overflow:hidden;
  }
  .timer .fill{height:100%; width:38%; background:var(--accent); border-radius:9999px}
  /* hint de iesire, foarte discret */
  .exit{
    position:fixed; bottom:28px; left:0; right:0; text-align:center;
    font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted);
  }
  .exit b{color:var(--text-muted); font-family:'Space Mono',monospace; font-weight:400}
</style>
</head>
<body>
  <div class="word">labirint</div>
  <div class="timer"><div class="fill"></div></div>
  <div class="exit"><b>esc</b> &nbsp;·&nbsp; ieșire din fullscreen</div>
</body>
</html>
