name: word-bank-check

# Gate de freshness (D11): refuză push-ul dacă words.js nu corespunde lui wordbank.json.
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verifică freshness words.js
        run: python gen_words.py --check
