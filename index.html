<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RapScript RO</title>
  <!-- căi RELATIVE (Pages sub /rapscript-ro/) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <!-- rime ambientale: 5 sugestii sus, gri-umbră, pt cuvântul curent (Epic 7 / S3) -->
    <div id="rhyme-hint" class="rhyme-hint" aria-hidden="true"></div>
    <div class="hero">
      <h1 id="hero-word" class="hero-word" tabindex="-1">–</h1>
      <div class="timer-bar" aria-hidden="true"><div id="timer-fill" class="timer-bar__fill"></div></div>
    </div>
    <div class="deck">
      <div class="controls">
        <button id="btn-play-pause" class="btn" type="button" aria-pressed="false">▶ pornește</button>
        <span class="speed">
          <input id="speed-slider" class="speed-slider" type="range" min="2" max="12" step="1" value="4" aria-label="viteză">
          <span id="speed-value" class="speed-value">4s</span>
        </span>
        <span id="level-segments" class="level-segments" role="group" aria-label="nivel">
          <button class="level-segment" type="button" data-level="incepator">începător</button>
          <button class="level-segment" type="button" data-level="avansat">avansat</button>
          <button class="level-segment" type="button" data-level="profesionist">profesionist</button>
        </span>
        <button id="btn-mic" class="btn btn-icon" type="button" aria-pressed="false" aria-label="vorbește (ține apăsat M)" title="ține apăsat M (sau acest buton) și spune un cuvânt · Space = play/pauză" hidden>🎤</button>
        <button id="btn-fullscreen" class="btn btn-icon" type="button" aria-label="ecran complet" title="ecran complet">⛶</button>
      </div>
      <button id="open-viewer" class="link-btn" type="button">vezi cuvintele</button>
      <p id="message" class="message">se încarcă cuvintele…</p>
    </div>

    <!-- Drawer: viewer listă + adăugare (Epic 6 / S2) -->
    <div id="viewer" class="drawer" hidden>
      <div id="viewer-overlay" class="drawer__overlay"></div>
      <div class="drawer__panel" role="dialog" aria-label="cuvinte">
        <div class="drawer__head">
          <span id="viewer-title" class="drawer__title">…</span>
          <button id="viewer-close" class="btn btn-icon" type="button" aria-label="închide">✕</button>
        </div>
        <ul id="viewer-list" class="word-list"></ul>
        <div class="add-row">
          <input id="add-input" class="add-input" type="text" maxlength="40" placeholder="adaugă un cuvânt…" aria-label="adaugă cuvânt">
          <button id="add-btn" class="btn" type="button">adaugă</button>
        </div>
        <p id="add-status" class="add-status" aria-live="polite"></p>
        <!-- gazda widget-ului Turnstile (invizibil; activ doar dacă TURNSTILE_SITEKEY e setat) -->
        <div id="turnstile-host"></div>
      </div>
    </div>

  </main>

  <!-- banca + index de rime prin <script> (NU fetch — CORS pe file://, D2), ÎNAINTE de app.js -->
  <script src="words.js"></script>
  <script src="rhymes.js"></script>
  <script src="rhyme_rolex.js"></script><!-- index RoLEX (rime la orice cuvânt, grade 1-3 + fallback) -->
  <script src="app.js"></script>
</body>
</html>
